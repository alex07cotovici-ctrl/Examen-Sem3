<!DOCTYPE html>
<html lang="ro"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz-uri pentru examene</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#eef3f1;--surface:#ffffff;--sunk:#e3ebe8;--ink:#13201e;--mute:#5a6b67;--line:#d3ddd9;
 --accent:#0d6b60;--accent-soft:#d5ebe6;--ok:#16795a;
 --shadow:0 1px 2px rgba(19,32,30,.06),0 8px 24px rgba(19,32,30,.07);
 --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
 --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
 --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0c1514;--surface:#13201e;--sunk:#0f1a19;--ink:#e2ebe8;--mute:#93a5a0;--line:#263633;
 --accent:#3fc0ae;--accent-soft:#143a35;--ok:#4fd19f;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0c1514;--surface:#13201e;--sunk:#0f1a19;--ink:#e2ebe8;--mute:#93a5a0;--line:#263633;
 --accent:#3fc0ae;--accent-soft:#143a35;--ok:#4fd19f;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.55 var(--f-body);min-height:100vh}
.wrap{max-width:860px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-left,0px)) 48px max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:800;letter-spacing:-.015em;margin:0}
.eyebrow{font:600 .72rem/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
header h1{font-size:clamp(2rem,6vw,2.8rem);line-height:1.05;margin-top:8px}
header h1 span{color:var(--accent)}
header p{margin:8px 0 0;color:var(--mute);max-width:46ch}
.today{display:flex;gap:10px;flex-wrap:wrap}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:.88rem;color:var(--mute);box-shadow:var(--shadow)}
.chip b{font-family:var(--f-mono);color:var(--ink);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{--c:var(--accent);position:relative;display:flex;flex-direction:column;gap:12px;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s ease;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--c)}
.card:hover{transform:translateY(-2px);border-color:var(--c)}
.card:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.top{display:flex;gap:12px;align-items:center}
.ico{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.ico svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card h2{font-size:1.25rem;line-height:1.15}
.card .sub{font-size:.88rem;color:var(--mute);margin-top:2px}
.meta{display:flex;gap:8px;flex-wrap:wrap}
.tag{font:600 .7rem/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:7px;background:var(--sunk);color:var(--mute)}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .k{background:var(--c)}.bar .s{background:color-mix(in srgb,var(--c) 35%,transparent)}
.stat{display:flex;justify-content:space-between;font-size:.84rem;color:var(--mute);gap:8px}
.stat b{font-family:var(--f-mono);color:var(--ink);font-weight:600}
.go{margin-top:auto;display:flex;align-items:center;justify-content:space-between;font-weight:700;color:var(--c)}
.go svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;transition:transform .15s}
.card:hover .go svg{transform:translateX(3px)}
footer{margin-top:26px;color:var(--mute);font-size:.86rem;border-top:1px solid var(--line);padding-top:14px}
@media (prefers-reduced-motion:reduce){.card,.go svg{transition:none}}
</style></head><body>
<main class="wrap">
 <header>
  <div>
   <span class="eyebrow">Medicină · anul II</span>
   <h1>Quiz-uri pentru <span>examene</span></h1>
   <p>Alege materia. Progresul fiecărui quiz se păstrează separat, în browserul tău.</p>
  </div>
  <div class="today" id="today"></div>
 </header>
 <section class="grid" id="grid" aria-label="Quiz-uri"></section>
 <footer>Progresul apare aici doar dacă paginile quiz-urilor sunt deschise de pe același site.</footer>
</main>
<script>
/* Ca să adaugi un quiz nou: copiază un rând și schimbă datele.
   file = numele fișierului din același folder, key = KEY-ul din quiz, n = numărul de întrebări. */
const QUIZZES=[
 {file:"quiz-anatomie-completa.html",key:"anatomie-completa-v1",title:"Anatomie",sub:"Examen · culegerea completă",n:1424,color:"#bf3445",icon:"bone"},
 {file:"quiz-nursing.html",key:"nursing-apin-v1",title:"Nursing",sub:"Examen · educație interprofesională",n:333,color:"#2c5ea8",icon:"cross"},
 {file:"quiz-psihologie-examen.html",key:"psihologie-examen-2024-v1",title:"Psihologie medicală",sub:"Examen · sesiunea 2024–2025",n:300,color:"#7a4fb3",icon:"mind"},
 {file:"quiz-igiena.html",key:"igiena-examen-v1",title:"Igienă",sub:"Examen · sem. 3",n:696,color:"#0d6b60",icon:"drop"},
 {file:"quiz-fiziologie-examen.html",key:"fiziologie-examen-v1",title:"Fiziologie",sub:"Examen · SNV, endocrin, cardiovascular",n:517,color:"#c9960c",icon:"heart"},
];
const ICONS={
 bone:'<path d="M7 5a2.5 2.5 0 1 0-2 4l10 10a2.5 2.5 0 1 0 4-2 2.5 2.5 0 1 0-2-4L7 3a2.5 2.5 0 1 0-2 2"/>',
 cross:'<path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/>',
 mind:'<path d="M9 20v-3c-3 0-5-2-5-5 0-4 3-8 8-8s8 3 8 7c0 1.5 1 2.5 1 3.5 0 .8-.6 1-1.5 1H19v2c0 1-1 2-2 2h-2v1"/><circle cx="12.5" cy="10.5" r="2"/>',
 drop:'<path d="M12 3s-6 7-6 11a6 6 0 0 0 12 0c0-4-6-11-6-11z"/>',
 heart:'<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>',
 cell:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>',
 book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 19V5"/>'
};
const load=k=>{try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}};
const dk=o=>{const d=new Date(Date.now()-o*864e5);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function ago(log){
 if(!log)return null;
 for(let o=0;o<365;o++){const t=log[dk(o)];if(t&&(t[0]+t[1])>0)return o===0?"azi":o===1?"ieri":`acum ${o} zile`}
 return null}
let todayN=0,activeDays=new Set();
const grid=document.getElementById("grid");
grid.innerHTML=QUIZZES.map(q=>{
 const st=load(q.key)||{},log=load(q.key+"-log")||{};
 const vals=Object.values(st);
 const seen=vals.filter(h=>h&&(h.c||h.w||h.d)).length, known=vals.filter(h=>h&&h.l===1).length;
 const t=log[dk(0)];if(t)todayN+=t[0]+t[1];
 Object.keys(log).forEach(d=>{const v=log[d];if(v&&v[0]+v[1]>0)activeDays.add(d)});
 const pk=Math.min(100,known/q.n*100),ps=Math.min(100-pk,(seen-known)/q.n*100);
 const last=ago(log);
 return `<a class="card" href="${esc(q.file)}" style="--c:${esc(q.color)}">
  <div class="top"><div class="ico"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[q.icon]||ICONS.book}</svg></div>
   <div><h2>${esc(q.title)}</h2><div class="sub">${esc(q.sub)}</div></div></div>
  <div class="meta"><span class="tag">${q.n} întrebări</span>${last?`<span class="tag">activ ${last}</span>`:""}</div>
  <div class="bar" role="img" aria-label="${known} știute, ${seen} parcurse din ${q.n}"><i class="k" style="width:${pk}%"></i><i class="s" style="width:${ps}%"></i></div>
  <div class="stat"><span><b>${seen}</b> / ${q.n} parcurse</span><span><b>${known}</b> știute</span></div>
  <div class="go">${seen?"Continuă":"Începe"}<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
 </a>`}).join("");
let streak=0;for(let o=0;o<400;o++){if(activeDays.has(dk(o)))streak++;else if(o>0)break}
document.getElementById("today").innerHTML=`<span class="chip"><b>${todayN}</b> răspunsuri azi</span><span class="chip"><b>${streak}</b> ${streak===1?"zi":"zile"} la rând</span>`;
</script>
</body></html>
